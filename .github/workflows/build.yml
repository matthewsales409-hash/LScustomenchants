name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        working-directory: LSCustomEnchants
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: LSCustomEnchants
          path: LSCustomEnchants/target/LSCustomEnchants-*.jar
      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LSCustomEnchants/target/LSCustomEnchants-*.jar
